# Broker plus MinIO, to try the cold-storage tier with no cloud account.
#   docker compose -f deploy/docker/compose.s3.yaml up
services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  createbucket:
    image: quay.io/minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/kafka-wire &&
      echo bucket ready"

  kafka-wire:
    image: ghcr.io/csnyder256/kafka-wire:latest
    depends_on: { createbucket: { condition: service_completed_successfully } }
    ports: ["9092:9092", "8080:8080"]
    environment:
      KAFKA_WIRE_LISTENERS_ADVERTISEDHOST: localhost
      KAFKA_WIRE_AUTH_ALLOWANON: "true"
      KAFKA_WIRE_ARCHIVE_BACKEND: s3
      KAFKA_WIRE_ARCHIVE_S3_BUCKET: kafka-wire
      KAFKA_WIRE_ARCHIVE_S3_ENDPOINT: http://minio:9000
      # MinIO, Ceph and SeaweedFS address buckets by path, not by subdomain.
      KAFKA_WIRE_ARCHIVE_S3_ADDRESSING: path
      KAFKA_WIRE_ARCHIVE_S3_ACCESSKEY: minioadmin
      KAFKA_WIRE_ARCHIVE_S3_SECRETKEY: minioadmin
      # Archive quickly so the tier is observable in a demo rather than in an
      # hour. Leave these at their defaults in production.
      KAFKA_WIRE_ARCHIVE_AGE: 1m
      KAFKA_WIRE_STORAGE_SEGMENTBYTES: 16MiB
    volumes: ["kafka-wire-data:/data"]
    stop_grace_period: 30s

volumes:
  minio-data:
  kafka-wire-data:
