name: Adversarial harness

# Not part of the blocking CI gate, deliberately.
#
# The harness provisions, attacks and asserts correctly, and a short run
# reports zero invariant violations. It runs on a schedule and on demand
# instead of on every push because the nightly window is a deliberate,
# unbounded-length adversarial soak -- same posture as the per-push gate
# being the fast suite and this being the fuzzing one.
# (2026-09-19: the daemon now exits on its own --duration -- daemon.py
# bounds every module call to the remaining window, bounds baseline
# shutdown, and carries a duration+grace watchdog -- so the external
# `timeout` in chaos/run.sh is a backstop, not a crutch.)
# See chaos/README.md for the harness.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Seconds to attack for'
        default: '300'
      principals:
        description: 'Number of principals'
        default: '4'

permissions:
  contents: read

jobs:
  chaos:
    name: attack the broker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Attack
        run: |
          pip install --quiet -r chaos/requirements.txt
          bash chaos/run.sh "${{ inputs.duration || 300 }}" "${{ inputs.principals || 4 }}"

      - name: Forensics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-forensics
          path: /tmp/tmp.*/forensics
          if-no-files-found: ignore
